defaults:
  - _self_
  - path: applewood_remote
  - model: InceptionTime10
  - training: basic
  - dataset: square-nothing_ch2_all
  - transforms: tsbasic
  - loader: basic

pretrain_checkpoint: null
suffix: "" #_${now:%Y-%m-%d_%H-%M-%S.%f}
name:  ${dataset.name}_${model.name}_${transforms.name}_${loader.name}_${training.name}__${seed}_${suffix}
#${dataset.name}${take_id:${dataset.task},0}_${dataset.seq_len}_${dataset.pred_len}_${model.name}_${transforms.name}_${loader.name}_${training.name}__${seed}_${suffix}

save_dir: ${path.base_path_models}/${name}
seed: 0 # Seed for reproducibility
mode: base # execution mode: base, force, clean, check

hydra:
  run:
    dir: ./data/outputs/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ./data/outputs/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.name}
    subdir: ${hydra.job.num}