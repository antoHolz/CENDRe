mean: null
std: null
task: classification
n_channels: 2
n_classes: 2
name: midhighFreq-highFreq_ch2_specificChannels_conf-midFreq-50-50
fs: 400
type: timeseries
xcols:
- X1
- X2
ycols:
- y
maskcols:
- midhighFreq_X1
- midhighFreq_X2
- highFreq_X1
- highFreq_X2
- midhighFreq
- highFreq
- background_X1
- background_X2
- background
counfoundercols:
- midFreq_X1
- midFreq_X2
test:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
train:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${path.base_path_datasets}/synthetic/${dataset.name}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
val:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
pretransform:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.HFToTensor
    fields: ${dataset.xcols} + ${dataset.ycols}
  - _target_: modules.transforms.HFStack
    fields: ${dataset.xcols}
    dim: 0
    new_name: x
  - _target_: modules.transforms.HFCat
    fields: ${dataset.ycols}
    dim: 0
    new_name: y
  - _target_: modules.transforms.HFSelect
    fields:
    - x
    - y
