#############################################################################################
# General parameters
#############################################################################################
mean:
- -4.1620417808492976e-11
n_channels: 1
n_classes: 2
name: GunPoint
std:
- 0.9966610925357354
# og length = 150
task: forecasting
seq_len: 144
label_len: ${add:${dataset.seq_len},-${dataset.pred_len} }
pred_len: 12
window_size: ${add:${dataset.seq_len},${dataset.pred_len}}
c_in: ${dataset.n_channels} # n_channels in non-forecasting models
c_out: null
#############################################################################################
# Dataset configurations
#############################################################################################
type: timeseries
test:
  _target_: modules.dataset.npymapDatasetF
  root: ${dataset.train.root}
train:
  _target_: modules.dataset.npymapDatasetF
  root: ${path.base_path_datasets}/UCR/${dataset.name}
val:
  _target_: modules.dataset.npymapDatasetF
  root: ${dataset.train.root}
#############################################################################################
# Preprocessing parameters
#############################################################################################
pretransform: 
  _target_: torchvision.transforms.Compose
  transforms:
  # - _target_: modules.transforms.tstransforms.TSStandardize
  #   mean: ${dataset.mean}
  #   std: ${dataset.std}
  # - _target_: modules.transforms.tstransforms.TSTimeWarp2
  #   knot: 4
  #   sigma: 0.05
  - _target_: modules.transforms.tstransforms.TSToTensor
  # - _target_: modules.transforms.tstransforms.TSGaussianNoise
  #   std: 0.01
  # - _target_: modules.transforms.tstransforms.TSResize
  #   new_length: 100
  #   mode: linear

  
# For forecasting
posttransform: 
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.tstransforms.TSSwapAxes
    axis1: 0
    axis2: 1
  - _target_: modules.transforms.tstransforms.TSSampleWindow
    window_size: ${dataset.window_size}
  - _target_: modules.transforms.tstransforms.TSSplitWindow
    seq_len: ${dataset.seq_len}
    label_len: ${dataset.label_len}
    pred_len: ${dataset.pred_len}
    
