mean:
  vibration_1: -0.01647363675796554
std:
  vibration_1: 0.5471070425662165
task: classification
n_channels: 1
n_classes: 3
name: BearingPD
fs: 64000
type: timeseries
xcols:
- vibration_1
ycols:
- label
maskcols: []
counfoundercols: []
test:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
train:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${path.base_path_datasets}/others/${dataset.name}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
val:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
pretransform:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.HFToTensor
    fields: ${dataset.xcols} + ${dataset.ycols}
  - _target_: modules.transforms.HFStack
    fields: ${dataset.xcols}
    dim: 0
    new_name: x
  - _target_: modules.transforms.HFCat
    fields: ${dataset.ycols}
    dim: 0
    new_name: 'y'
  - _target_: modules.transforms.HFSelect
    fields:
    - x
    - 'y'