mean: null
std: null
task: classification
n_channels: 1
n_classes: 2
name: triangle-circle_ch1_specificChannels_conf-square-60-40
fs: 400
type: timeseries
xcols:
- X
ycols:
- y
maskcols:
- triangle_X
- circle_X
- triangle
- circle
# - background_X
# - background
counfoundercols:
- square_X
test:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
train:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${path.base_path_datasets}/synthetic/${dataset.name}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
val:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
pretransform:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.HFToTensor
    fields: ${dataset.xcols} + ${dataset.ycols}
  - _target_: modules.transforms.HFStack
    fields: ${dataset.xcols}
    dim: 0
    new_name: x
  - _target_: modules.transforms.HFCat
    fields: ${dataset.ycols}
    dim: 0
    new_name: y
  - _target_: modules.transforms.HFSelect
    fields:
    - x
    - y
