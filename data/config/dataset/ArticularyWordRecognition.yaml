#############################################################################################
# General parameters
#############################################################################################
mean: null
n_channels: 9
n_classes: 25
name: ArticularyWordRecognition
std: null
task: classification
#############################################################################################
# Dataset configurations
#############################################################################################
type: timeseries
xcols:
- dim_0
- dim_1
- dim_2
- dim_3
- dim_4
- dim_5
- dim_6
- dim_7
- dim_8
ycols:
- label

test:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
train:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${path.base_path_datasets}/UCR_hf/${dataset.name}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
val:
  _target_: modules.dataset.HFDataset
  dataset:
    _target_: datasets.Dataset.load_from_disk
    dataset_path: ${dataset.train.dataset.dataset_path}
  xcols: ${dataset.xcols}
  ycols: ${dataset.ycols}
#############################################################################################
# Preprocessing parameters
#############################################################################################
pretransform:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.HFToTensor
    fields: ${dataset.xcols} + ${dataset.ycols}
  - _target_: modules.transforms.HFStack
    fields: ${dataset.xcols}
    dim: 0
    new_name: x
  - _target_: modules.transforms.HFCat
    fields: ${dataset.ycols}
    dim: 0
    new_name: y
  - _target_: modules.transforms.HFSelect
    fields:
    - x
    - y
