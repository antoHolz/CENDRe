name: tscHFWarpCropNoise001
standardize: ${requires_standardize:${transforms.train.transforms},${transforms.val.transforms},${transforms.test.transforms}}
train:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.hftransforms.HFStandardize2
    fields_x: ${dataset.xcols}
    mean: ${dataset.mean}
    std: ${dataset.std}
  - _target_: modules.transforms.hftransforms.HFTimeWarp
    fields:
    - x
    knot: 4
    sigma: 0.05
  - _target_: modules.transforms.hftransforms.HFRandomCropPad
    fields: ['x']
    magnitude: 0.05
  - _target_: modules.transforms.hftransforms.HFAddGaussianNoise
    fields: ['x']
    mean: 0
    std: 0.01

val:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.hftransforms.HFStandardize2
    fields_x: ${dataset.xcols}
    mean: ${dataset.mean}
    std: ${dataset.std}
  # - _target_: modules.transforms.hftransforms.HFTimeWarp
  #   fields:
  #   - x
  #   knot: 4
  #   sigma: 0.05
  # - _target_: modules.transforms.hftransforms.HFRandomCropPad
  #   fields: ['x']
  #   magnitude: 0.05

test:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.hftransforms.HFStandardize2
    fields_x: ${dataset.xcols}
    mean: ${dataset.mean}
    std: ${dataset.std}
  # - _target_: modules.transforms.hftransforms.HFTimeWarp
  #   fields:
  #   - x
  #   knot: 4
  #   sigma: 0.05
  # - _target_: modules.transforms.hftransforms.HFRandomCropPad
  #   fields: ['x']
  #   magnitude: 0.05
  - _target_: modules.transforms.hftransforms.HFAddGaussianNoise
    fields: ['x']
    mean: 0
    std: 0.01
