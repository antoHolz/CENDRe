name: tsWarpCropNoise001
standardize: ${requires_standardize:${transforms.train.transforms},${transforms.val.transforms},${transforms.test.transforms}}
train:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.tstransforms.TSToTensor
  - _target_: modules.transforms.tstransforms.TSStandardize
    mean: ${dataset.mean}
    std: ${dataset.std}
  - _target_: modules.transforms.tstransforms.TSTimeWarp2
    knot: 4
    sigma: 0.05
  - _target_: modules.transforms.tstransforms.TSRandomCropPad
    magnitude: 0.05
  - _target_: modules.transforms.tstransforms.TSGaussianNoise
    std: 0.01

  
val:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.tstransforms.TSToTensor
  - _target_: modules.transforms.tstransforms.TSStandardize
    mean: ${dataset.mean}
    std: ${dataset.std}
  # - _target_: modules.transforms.tstransforms.TSTimeWarp2
  #   knot: 4
  #   sigma: 0.05
  # - _target_: modules.transforms.tstransforms.TSRandomCropPad
  #   magnitude: 0.9


test:
  _target_: torchvision.transforms.Compose
  transforms:
  - _target_: modules.transforms.tstransforms.TSToTensor
  - _target_: modules.transforms.tstransforms.TSStandardize
    mean: ${dataset.mean}
    std: ${dataset.std}
  # - _target_: modules.transforms.tstransforms.TSTimeWarp2
  #   knot: 4
  #   sigma: 0.05
  # - _target_: modules.transforms.tstransforms.TSRandomCropPad
  #   magnitude: 0.9
  - _target_: modules.transforms.tstransforms.TSGaussianNoise
    std: 0.01
