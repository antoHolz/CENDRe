defaults:
  - _self_
  - path: applewood_remote
  - model: InceptionTime10
  - training: basic
  - dataset: square-nothing_ch2_all
  - transforms: basic
  - loader: basic
  - layers: ${model}_1
  - CE: ECLAD

pretrain_checkpoint: null
suffix: "" #_${now:%Y-%m-%d_%H-%M-%S.%f}
name: ${dataset.name}_${model.name}_${transforms.name}_${loader.name}_${training.name}__${seed}_${suffix}

save_dir_model:  ${path.base_path_models}/${name} 
save_dir: ${CE.base_path_ce}/${name}/out${CE.multilabel_out}/cnr_${CE.n_concepts}/metrics
seed: 0
seeds: [0] # Seed for reproducibility
models: [InceptionTime10] # List of models to evaluate
methods: [ECLADts] # List of methods to evaluate
n_concepts: [2] # List of number of concepts to evaluate
mode: base # execution mode: base, force, force-report, force-metric,  clean, check
eval_metrics: ['dst_eclad'] # Options: dst_eclad, soft_iou, soft_dice, cdc, epg, soft_precision, soft_recall, rma
alignment_metrics: [RC, IC, sIC, sICperprim, sRC, sRCmax, oRC, NMI] # alignment formulas applied on top of each eval_metric

hydra:
  run:
    dir: ./data/outputs/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ./data/multirun/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.name}
    subdir: ${hydra.job.num}