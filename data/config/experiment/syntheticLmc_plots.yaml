# @package _global_
defaults:
  - override /transforms: tsHFbasic
  - override /loader: M
  - override /training: adamw_patient

hydra: 
  mode: MULTIRUN
  sweeper:
    params:
      datasets: 
        - circle-nothing_ch2_random
        - square-nothing_ch2_random
        - triangle-nothing_ch2_random
        - triangle-circle_ch2_specificChannels
        - square-triangle_ch2_specificChannels
        - square-circle_ch2_specificChannels
      seeds: [0,1,2]
      models:
        - InceptionTime10
        - ResNet1D18
        - DenseNet1D121
      methods:
        - ECLADts
        - MultiVISION
        - CENDREACsilhouette
        - CENDREHDBSCAN
        - CENDREkMeans
      n_concepts: [2,4,6,8,10]
      exp_name: syntheticLmc
      eval_metrics: [dst_eclad, rma] # [dst_eclad,soft_dice, rma, soft_recall] soft dice and recall measure different things (and higher not necessarily better) thus removing from current setting.
      save_pdf: False
      k_mode: best
