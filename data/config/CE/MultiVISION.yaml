name: 'MultiVISION'
n_concepts: 10
n_instances: 2560 # n_batches: round(2560/${CE.loader.batch_size})
base_path_ce: ./data/ConceptExtraction/${CE.name}
save_dir: ${CE.base_path_ce}/${name}/out${CE.multilabel_out} #/out${CE.multilabel_out} #future /${layers.name}_nc${CE.n_concepts}
device: 'cuda'
layer_config: ${layers.name}
decorrelated: False
domain: ['input'] # only 'input'
multilabel_out: 0


object: 
  _target_: cel.CE.MultiVISION.MultiVISION
  dimension: ${model.dimensionality}
  layer_names: ${layers.layerDict_mv}
  n_concepts: ${CE.n_concepts}
  task: ${dataset.task}
  vis_mode: 'Upsampling' #ERF
  t_factor: 0.99 
  n_classes: ${dataset.n_classes}

loader: #${loader.object}
  _target_: modules.loader.create_dataloaders
  train_size: 0.7
  test_size: 0.0
  batch_size: 64
  balanced: True
  multiplier: 1
  seed: ${training.seed}
  num_workers: 4