layerconf_nr: 1
concept_nr: 3
force_fit: false
force_report: false
decorrelated: true
multilabel_out: 2
path:
  results: ${dataset.name}_${transforms.name}_${model.name}_${training.name}_${training.seed}
  name: mypath1
  base_path_datasets: D:/Datasets/DS_TS
  base_path_models: ./data/models
  base_path_ce: ./data/ConceptExtraction/${CE.name}
  base_path: ./data
model:
  name: InceptionTime10
  object:
    _target_: modules.model.create_model
    name: InceptionTime
    type: 1D
    c_in: ${dataset.n_channels}
    c_out: ${dataset.n_classes}
    depth: 10
training:
  name: normalC
  device: cuda
  seed: 1
  save_model: true
  loss:
    _target_: torch.nn.NLLLoss
  optimizer:
    _target_: torch.optim.SGD
    lr: 0.1
    momentum: 0.9
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min
    factor: 0.1
    patience: 8
  scheduler_monitor: train_loss_epoch
  min_epochs: 20
  max_epochs: 100
  early_stopping_config:
    monitor: valid_acc_epoch
    min_delta: 0.001
    patience: 15
    verbose: false
    mode: max
  gradient_clip_val: 1
  metrics:
  - acc
  - f1
  gradient_accumulation_steps: 5
  loggers:
    tensorboard:
      _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
      save_dir: ${path.base_path_models}/${path.results}
      name: tb
    csv:
      _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
      save_dir: ${path.base_path_models}/${path.results}
      name: csv
  num_classes: ${dataset.n_classes}
dataset:
  n_channels: 1
  n_classes: 2
  name: syntheticL1
  task: classification
  test:
    _target_: modules.utils.npymapDataset
    root: ${dataset.train.root}
  train:
    _target_: modules.utils.npymapDataset
    root: ${path.base_path_datasets}/others/${dataset.name}
  type: timeseries
  eval_path: ${path.base_path_datasets}/others/${dataset.name}/primitives
transforms:
  name: tsLsmall
  train:
    _target_: torchvision.transforms.Compose
    transforms:
    - _target_: tsai.data.transforms.ToTSTensor
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSTimeWarp
        magnitude: 0.2
        ord: 2
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSRandomCropPad
        magnitude: 0.9
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSGaussianNoise
        magnitude: 0.2
        additive: false
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSGaussianNoise
        magnitude: 0.015
        additive: true
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSResize
        magnitude: -0.5
        mode: linear
    - _target_: modules.utils.customTransforms.ToTensor
  test:
    _target_: torchvision.transforms.Compose
    transforms:
    - _target_: tsai.data.transforms.ToTSTensor
    - _target_: modules.utils.customTransforms.tsaiWrapper
      tsaiTransform:
        _target_: tsai.data.transforms.TSResize
        magnitude: -0.5
        mode: linear
        size: null
    - _target_: modules.utils.customTransforms.ToTensor
loader:
  name: xs
  object:
    _target_: modules.dataset.create_dataloaders
    train_size: 0.5
    batch_size: 4
    balanced: true
    multiplier: 1
    seed: ${training.seed}
    num_workers: 8
layers:
  name: InceptionTime10_1
  layerDict:
  - model.inceptionblock.inception.5.convs.1
  - model.inceptionblock.inception.6.convs.2
  - model.inceptionblock.inception.7.convs.2
  - model.inceptionblock.inception.9.convs.2
CE:
  name: ECLAD
  layerconf_nr: 1
  concept_nr: 50
  decorrelated: true
  multilabel_out: 2
